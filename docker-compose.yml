services:
  backend:
    build: .
    container_name: aiknowledge-backend

    ports:
      - "3001:3000"
      - "5555:5555"

    volumes:
      - .:/app
      - /app/node_modules

    env_file:
      - .env

    environment:
      NODE_ENV: development

    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg17

    container_name: aiknowledge-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiknowledge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama

    container_name: aiknowledge-ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: